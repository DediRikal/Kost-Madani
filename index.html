<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Ketersediaan Kamar Kost</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between font-sans">

    <!-- Header / Navigasi Cabang -->
    <header class="w-full bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-4">
            <h1 class="text-xl font-extrabold text-slate-900 mb-3 text-center">Ketersediaan Kamar Kost</h1>
            
            <!-- Tombol Pilih Cabang -->
            <div id="tab-cabang" class="flex justify-center gap-2 overflow-x-auto pb-1">
                <!-- Tombol cabang akan dirender otomatis via JS atau bisa disesuaikan -->
                <button onclick="gantiCabang('Madani 1', 12, this)" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold transition bg-slate-900 text-white shadow">Madani 1</button>
                <button onclick="gantiCabang('Madani 2', 10, this)" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold transition bg-slate-200 text-slate-600 hover:bg-slate-300">Madani 2</button>
                <button onclick="gantiCabang('Madani Putri', 15, this)" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold transition bg-slate-200 text-slate-600 hover:bg-slate-300">Madani Putri</button>
            </div>
        </div>
    </header>

    <!-- Konten Utama: Grid Kamar -->
    <main class="max-w-4xl w-full mx-auto px-4 py-6 flex-grow">
        <!-- Informasi Status & Legenda -->
        <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
            <div>
                <h2 id="judul-cabang" class="font-bold text-base text-slate-900">Cabang: Madani 1</h2>
                <p class="text-xs text-slate-500">Menampilkan status kamar secara real-time</p>
            </div>
            <div class="flex items-center gap-3 text-xs font-semibold">
                <div class="flex items-center gap-1.5">
                    <span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span>
                    <span class="text-slate-600">Tersedia</span>
                </div>
                <div class="flex items-center gap-1.5">
                    <span class="w-3 h-3 rounded-full bg-rose-500 inline-block"></span>
                    <span class="text-slate-600">Terisi</span>
                </div>
            </div>
        </div>

        <!-- Grid Container Kamar -->
        <div id="grid-kamar" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
            <!-- Data kamar akan dimasukkan secara dinamis melalui JavaScript -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-400 border-t border-slate-200 bg-white">
        &copy; 2026 Manajemen Kost. All rights reserved.
    </footer>

    <!-- JavaScript Logika & Sinkronisasi LocalStorage -->
    <script>
        // Variabel Global Default
        let cabangAktif = 'Madani 1';
        let totalKamarAktif = 12;

        // Fungsi untuk mengganti cabang kost
        function gantiCabang(namaCabang, jumlahKamar, element) {
            cabangAktif = namaCabang;
            totalKamarAktif = jumlahKamar;
            
            // Perbarui Judul Cabang di Tampilan
            document.getElementById('judul-cabang').innerText = `Cabang: ${namaCabang}`;

            // Perbarui Style Tombol Aktif / Non-aktif
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn px-4 py-2 rounded-xl text-xs font-bold transition bg-slate-200 text-slate-600 hover:bg-slate-300";
            });
            element.className = "tab-btn px-4 py-2 rounded-xl text-xs font-bold transition bg-slate-900 text-white shadow";

            // Render ulang grid kamar sesuai cabang yang dipilih
            renderKamar();
        }

        // Fungsi Render Kartu Kamar
        function renderKamar() {
            // Mengambil database status kamar dari localStorage (Sinkron dengan halaman admin/pembayaran)
            const statusKamarMap = JSON.parse(localStorage.getItem('status_kamar_kost')) || {};
            const container = document.getElementById('grid-kamar');
            container.innerHTML = '';

            for (let i = 1; i <= totalKamarAktif; i++) {
                const nomorKamar = `Kamar ${i < 10 ? '0' + i : i}`;
                const keyKamar = `${cabangAktif}-${nomorKamar}`;
                
                // Status dianggap terisi/lunas jika bernilai 'Lunas' di localStorage
                const isLunas = statusKamarMap[keyKamar] === 'Lunas';

                const card = document.createElement('div');
                card.className = `p-4 rounded-2xl border transition shadow-sm flex flex-col justify-between h-32 ${
                    isLunas 
                        ? 'bg-rose-50/60 border-rose-200 text-rose-950' 
                        : 'bg-emerald-50/60 border-emerald-200 text-emerald-950'
                }`;

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <span class="font-extrabold text-base tracking-tight">${nomorKamar}</span>
                        <span class="w-3 h-3 rounded-full ${isLunas ? 'bg-rose-500 shadow-sm shadow-rose-300' : 'bg-emerald-500 shadow-sm shadow-emerald-300'}"></span>
                    </div>
                    <div>
                        <span class="text-xs font-bold px-3 py-1.5 rounded-xl inline-block ${
                            isLunas ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'
                        }">
                            ${isLunas ? 'Terisi / Lunas' : 'Tersedia'}
                        </span>
                    </div>
                `;
                container.appendChild(card);
            }
        }

        // Jalankan render pertama kali saat halaman dimuat
        document.addEventListener("DOMContentLoaded", () => {
            renderKamar();
        });

        // Event listener untuk mendeteksi perubahan data dari tab/halaman lain (Real-time sync)
        window.addEventListener('storage', (event) => {
            if (event.key === 'status_kamar_kost') {
                renderKamar();
            }
        });
    </script>
</body>
</html>
