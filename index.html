<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kost Madani - Beranda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <header class="bg-white/90 backdrop-blur-md sticky top-0 z-40 border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-building-user text-blue-600 text-2xl"></i>
                <span class="font-bold text-xl tracking-tight text-slate-900">Kost Madani</span>
            </div>
            <nav class="flex gap-6">
                <a href="index.html" class="text-blue-600 font-semibold border-b-2 border-blue-600 pb-1">Beranda</a>
                <a href="pembayaran.html" class="text-slate-600 hover:text-blue-600 font-medium transition">Pembayaran</a>
                <a href="database.html" class="text-slate-600 hover:text-blue-600 font-medium transition">Database</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full space-y-12">
        
        <section class="text-center max-w-2xl mx-auto">
            <h1 class="text-3xl font-extrabold text-slate-900 sm:text-4xl">Cek Status & Ketersediaan Kamar</h1>
            <p class="mt-3 text-slate-600 text-sm sm:text-base">Pilih cabang untuk melihat status ketersediaan dan kelunasan pembayaran kamar secara real-time.</p>
        </section>

        <!-- Filter Cabang -->
        <div class="flex justify-center gap-3 flex-wrap">
            <button onclick="tampilkanKamar('Madani 1', 9)" id="btn-m1" class="tab-btn px-5 py-2.5 rounded-xl font-bold text-sm bg-blue-600 text-white shadow-md">Madani 1 (9 Kamar)</button>
            <button onclick="tampilkanKamar('Madani 2', 10)" id="btn-m2" class="tab-btn px-5 py-2.5 rounded-xl font-bold text-sm bg-white text-slate-600 border border-slate-200 hover:bg-slate-100">Madani 2 (10 Kamar)</button>
            <button onclick="tampilkanKamar('Madani Putri', 16)" id="btn-mp" class="tab-btn px-5 py-2.5 rounded-xl font-bold text-sm bg-white text-slate-600 border border-slate-200 hover:bg-slate-100">Madani Putri (16 Kamar)</button>
        </div>

        <!-- Legend Status -->
        <div class="flex justify-center gap-6 text-xs font-semibold text-slate-600">
            <div class="flex items-center gap-2">
                <span class="w-3.5 h-3.5 rounded-full bg-emerald-500 inline-block"></span> Kosong / Belum Lunas
            </div>
            <div class="flex items-center gap-2">
                <span class="w-3.5 h-3.5 rounded-full bg-rose-500 inline-block"></span> Terisi / Lunas
            </div>
        </div>

        <!-- Grid Kamar -->
        <div id="grid-kamar" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 max-w-5xl mx-auto">
            <!-- Render via JS -->
        </div>
    </main>

    <script>
        let cabangAktif = 'Madani 1';
        let totalKamarAktif = 9;

        function tampilkanKamar(cabang, totalKamar) {
            cabangAktif = cabang;
            totalKamarAktif = totalKamar;
            
            // Update Tampilan Tombol Tab
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn px-5 py-2.5 rounded-xl font-bold text-sm bg-white text-slate-600 border border-slate-200 hover:bg-slate-100";
            });
            if(cabang === 'Madani 1') document.getElementById('btn-m1').className = "tab-btn px-5 py-2.5 rounded-xl font-bold text-sm bg-blue-600 text-white shadow-md";
            if(cabang === 'Madani 2') document.getElementById('btn-m2').className = "tab-btn px-5 py-2.5 rounded-xl font-bold text-sm bg-indigo-600 text-white shadow-md";
            if(cabang === 'Madani Putri') document.getElementById('btn-mp').className = "tab-btn px-5 py-2.5 rounded-xl font-bold text-sm bg-pink-600 text-white shadow-md";

            const statusKamarMap = JSON.parse(localStorage.getItem('status_kamar_kost')) || {};
            const container = document.getElementById('grid-kamar');
            container.innerHTML = '';

            for (let i = 1; i <= totalKamar; i++) {
                const nomerkamar = `Kamar ${i < 10 ? '0' + i : i}`;
                const keyKamar = `${cabang}-${nomerkamar}`;
                const isLunas = statusKamarMap[keyKamar] === 'Lunas';

                const card = document.createElement('div');
                card.className = `p-4 rounded-xl border flex flex-col justify-between h-28 transition shadow-sm ${
                    isLunas 
                        ? 'bg-rose-50 border-rose-200 text-rose-900' 
                        : 'bg-emerald-50 border-emerald-200 text-emerald-900'
                }`;

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <span class="font-bold text-base">${nomerkamar}</span>
                        <span class="w-3 h-3 rounded-full ${isLunas ? 'bg-rose-500' : 'bg-emerald-500'}"></span>
                    </div>
                    <div>
                        <span class="text-xs font-semibold px-2.5 py-1 rounded-md ${
                            isLunas ? 'bg-rose-200 text-rose-800' : 'bg-emerald-200 text-emerald-800'
                        }">
                            ${isLunas ? 'Lunas / Terisi' : 'Tersedia'}
                        </span>
                    </div>
                `;
                container.appendChild(card);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            tampilkanKamar('Madani 1', 9);
        });
    </script>
</body>
</html>
