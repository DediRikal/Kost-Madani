<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kost Madani - Database Pembayaran</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <header class="bg-white/90 backdrop-blur-md sticky top-0 z-40 border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-building-user text-blue-600 text-2xl"></i>
                <span class="font-bold text-xl tracking-tight text-slate-900">Kost Madani</span>
            </div>
            <nav class="flex gap-6">
                <a href="index.html" class="text-slate-600 hover:text-blue-600 font-medium transition">Beranda</a>
                <a href="pembayaran.html" class="text-slate-600 hover:text-blue-600 font-medium transition">Pembayaran</a>
                <a href="database.html" class="text-blue-600 font-semibold border-b-2 border-blue-600 pb-1">Database</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div>
                <h1 class="text-2xl font-extrabold text-slate-900">Database Transaksi & Status Kamar</h1>
                <p class="text-slate-500 text-sm">Kelola status kelunasan penghuni untuk memperbarui status kamar di Beranda.</p>
            </div>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-600">
                    <thead class="bg-slate-100 text-slate-700 font-semibold uppercase text-xs">
                        <tr>
                            <th class="px-6 py-4">Tanggal</th>
                            <th class="px-6 py-4">Cabang</th>
                            <th class="px-6 py-4">Nama Penghuni</th>
                            <th class="px-6 py-4">Kamar</th>
                            <th class="px-6 py-4">Periode</th>
                            <th class="px-6 py-4">Status</th>
                            <th class="px-6 py-4 text-center">Aksi Status</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-database" class="divide-y divide-slate-200">
                        <!-- Data dimasukkan via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        function muatDatabase() {
            const listTransaksi = JSON.parse(localStorage.getItem('database_kost')) || [];
            const statusKamarMap = JSON.parse(localStorage.getItem('status_kamar_kost')) || {};
            const tbody = document.getElementById('tabel-database');
            
            if (listTransaksi.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-slate-400">Belum ada data transaksi masuk.</td></tr>`;
                return;
            }

            tbody.innerHTML = listTransaksi.map((item) => {
                const keyKamar = `${item.lokasi}-${item.kamar}`;
                const isLunas = statusKamarMap[keyKamar] === 'Lunas';
                
                return `
                    <tr class="hover:bg-slate-50">
                        <td class="px-6 py-4 whitespace-nowrap">${item.tanggal}</td>
                        <td class="px-6 py-4 whitespace-nowrap font-medium text-slate-900">${item.lokasi}</td>
                        <td class="px-6 py-4 whitespace-nowrap">${item.nama}</td>
                        <td class="px-6 py-4 whitespace-nowrap font-bold text-blue-600">${item.kamar}</td>
                        <td class="px-6 py-4 whitespace-nowrap">${item.periode}</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="px-3 py-1 text-xs font-semibold rounded-full ${isLunas ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                                ${isLunas ? 'Lunas' : 'Menunggu Konfirmasi'}
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-center">
                            <button onclick="toggleStatus('${item.lokasi}', '${item.kamar}')" 
                                class="px-3 py-1.5 rounded-lg text-xs font-bold transition ${isLunas ? 'bg-slate-200 text-slate-700 hover:bg-slate-300' : 'bg-emerald-600 text-white hover:bg-emerald-700'}">
                                <i class="fa-solid ${isLunas ? 'fa-rotate-left' : 'fa-check'} mr-1"></i>
                                ${isLunas ? 'Tandai Belum Lunas' : 'Set Lunas'}
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function toggleStatus(lokasi, kamar) {
            const keyKamar = `${lokasi}-${kamar}`;
            let statusKamarMap = JSON.parse(localStorage.getItem('status_kamar_kost')) || {};
            
            if (statusKamarMap[keyKamar] === 'Lunas') {
                delete statusKamarMap[keyKamar];
            } else {
                statusKamarMap[keyKamar] = 'Lunas';
            }

            localStorage.setItem('status_kamar_kost', JSON.stringify(statusKamarMap));
            muatDatabase();
        }

        document.addEventListener('DOMContentLoaded', muatDatabase);
    </script>
</body>
</html>
