<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kost Madani - Database Pembayaran</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <!-- Modal Form Login Password -->
    <div id="modal-login" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 md:p-8 max-w-sm w-full shadow-2xl border border-slate-100 text-center">
            <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-xl">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="text-xl font-bold text-slate-900 mb-1">Akses Database</h2>
            <p class="text-xs text-slate-500 mb-6">Masukkan PIN/Password pengelola untuk melanjutkan.</p>

            <form onsubmit="verifikasiPassword(event)" class="space-y-4">
                <div>
                    <input type="password" id="input-pin" placeholder="Masukkan PIN (Default: 1234)" required class="w-full text-center tracking-widest text-lg px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-md transition active:scale-95">
                    Masuk
                </button>
            </form>
        </div>
    </div>

    <header class="bg-white/90 backdrop-blur-md sticky top-0 z-40 border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-building-user text-blue-600 text-2xl"></i>
                <span class="font-bold text-xl tracking-tight text-slate-900">Kost Madani</span>
            </div>
            <nav class="flex gap-6">
                <a href="index.html" class="text-slate-600 hover:text-blue-600 font-medium transition">Beranda</a>
                <a href="pembayaran.html" class="text-slate-600 hover:text-blue-600 font-medium transition">Pembayaran</a>
                <a href="database.html" class="text-blue-600 font-semibold border-b-2 border-blue-600 pb-1">Database</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div>
                <h1 class="text-2xl font-extrabold text-slate-900">Database Transaksi & Status Kamar</h1>
                <p class="text-slate-500 text-sm">Kelola status kelunasan penghuni untuk memperbarui status kamar di Beranda.</p>
            </div>
            
            <!-- Tombol Log Out / Keluar -->
            <button onclick="logoutAdmin()" class="self-start md:self-auto px-4 py-2 bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 font-bold text-xs rounded-xl transition flex items-center gap-2 active:scale-95">
                <i class="fa-solid fa-right-from-bracket"></i> Log Out (Kunci Kembali)
            </button>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-600">
                    <thead class="bg-slate-100 text-slate-700 font-semibold uppercase text-xs">
                        <tr>
                            <th class="px-6 py-4">Tanggal</th>
                            <th class="px-6 py-4">Cabang</th>
                            <th class="px-6 py-4">Nama Penghuni</th>
                            <th class="px-6 py-4">Kamar</th>
                            <th class="px-6 py-4">Periode</th>
                            <th class="px-6 py-4">Status</th>
                            <th class="px-6 py-4 text-center">Aksi Status</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-database" class="divide-y divide-slate-200">
                        <!-- Data dimasukkan via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const PIN_BENAR = "1234"; // PIN Default Pengelola

        function cekAkses() {
            const isLogin = sessionStorage.getItem('admin_login');
            const modal = document.getElementById('modal-login');
            
            if (isLogin === 'true') {
                modal.classList.add('hidden');
                muatDatabase();
            } else {
                modal.classList.remove('hidden');
            }
        }

        function verifikasiPassword(e) {
            e.preventDefault();
            const pinInput = document.getElementById('input-pin').value;

            if (pinInput === PIN_BENAR) {
                sessionStorage.setItem('admin_login', 'true');
                document.getElementById('modal-login').classList.add('hidden');
                document.getElementById('input-pin').value = '';
                muatDatabase();
            } else {
                alert("PIN Salah! Akses ditolak.");
                document.getElementById('input-pin').value = '';
            }
        }

        // Fungsi Log Out: Menghapus sesi login & menampilkan kembali modal password
        function logoutAdmin() {
            sessionStorage.removeItem('admin_login');
            const modal = document.getElementById('modal-login');
            modal.classList.remove('hidden');
            document.getElementById('input-pin').value = '';
        }

        function muatDatabase() {
            const listTransaksi = JSON.parse(localStorage.getItem('database_kost')) || [];
            const statusKamarMap = JSON.parse(localStorage.getItem('status_kamar_kost')) || {};
            const tbody = document.getElementById('tabel-database');
            
            if (listTransaksi.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-slate-400">Belum ada data transaksi masuk.</td></tr>`;
                return;
            }

            tbody.innerHTML = listTransaksi.map((item) => {
                const keyKamar = `${item.lokasi}-${item.kamar}`;
                const isLunas = statusKamarMap[keyKamar] === 'Lunas';
                
                return `
                    <tr class="hover:bg-slate-50">
                        <td class="px-6 py-4 whitespace-nowrap">${item.tanggal}</td>
                        <td class="px-6 py-4 whitespace-nowrap font-medium text-slate-900">${item.lokasi}</td>
                        <td class="px-6 py-4 whitespace-nowrap">${item.nama}</td>
                        <td class="px-6 py-4 whitespace-nowrap font-bold text-blue-600">${item.kamar}</td>
                        <td class="px-6 py-4 whitespace-nowrap">${item.periode}</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="px-3 py-1 text-xs font-semibold rounded-full ${isLunas ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                                ${isLunas ? 'Lunas' : 'Menunggu Konfirmasi'}
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-center">
                            <button onclick="toggleStatus('${item.lokasi}', '${item.kamar}')" 
                                class="px-3 py-1.5 rounded-lg text-xs font-bold transition ${isLunas ? 'bg-slate-200 text-slate-700 hover:bg-slate-300' : 'bg-emerald-600 text-white hover:bg-emerald-700'}">
                                <i class="fa-solid ${isLunas ? 'fa-rotate-left' : 'fa-check'} mr-1"></i>
                                ${isLunas ? 'Tandai Belum Lunas' : 'Set Lunas'}
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function toggleStatus(lokasi, kamar) {
            const keyKamar = `${lokasi}-${kamar}`;
            let statusKamarMap = JSON.parse(localStorage.getItem('status_kamar_kost')) || {};
            
            if (statusKamarMap[keyKamar] === 'Lunas') {
                delete statusKamarMap[keyKamar];
            } else {
                statusKamarMap[keyKamar] = 'Lunas';
            }

            localStorage.setItem('status_kamar_kost', JSON.stringify(statusKamarMap));
            muatDatabase();
        }

        document.addEventListener('DOMContentLoaded', cekAkses);
    </script>
</body>
</html>
