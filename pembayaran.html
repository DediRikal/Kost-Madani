<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kost Madani - Form Pembayaran</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <!-- HEADER & NAVIGATION BAR -->
    <header class="bg-white/90 backdrop-blur-md sticky top-0 z-40 border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-building-user text-blue-600 text-2xl"></i>
                <span class="font-bold text-xl tracking-tight text-slate-900">Kost Madani</span>
            </div>
            <nav class="flex gap-6">
                <a href="index.html" class="text-slate-600 hover:text-blue-600 font-medium transition">Beranda</a>
                <a href="pembayaran.html" class="text-blue-600 font-semibold border-b-2 border-blue-600 pb-1">Pembayaran</a>
                <a href="database.html" class="text-slate-600 hover:text-blue-600 font-medium transition">Database</a>
            </nav>
        </div>
    </header>

    <!-- MAIN FORM CONTAINER -->
    <main class="flex-grow max-w-2xl mx-auto px-4 sm:px-6 py-10 w-full">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-6 sm:p-8">
            <div class="mb-6">
                <h1 class="text-2xl font-bold text-slate-900">Konfirmasi Pembayaran</h1>
                <p class="text-slate-500 text-sm mt-1">Isi formulir di bawah ini untuk memperbarui status transaksi pembayaran kamu.</p>
            </div>

            <!-- Alert Notifikasi Sukses -->
            <div id="alertSuccess" class="hidden mb-6 bg-emerald-50 border border-emerald-200 text-emerald-800 p-4 rounded-xl text-sm flex items-center gap-3">
                <i class="fa-solid fa-circle-check text-emerald-600 text-xl"></i>
                <div>
                    <strong class="font-bold">Pembayaran Berhasil Dikirim!</strong>
                    <p class="text-xs text-emerald-700">Data telah masuk ke Database Admin. Menunggu konfirmasi kelunasan.</p>
                </div>
            </div>

            <form id="formPembayaran" onsubmit="simpanPembayaran(event)" class="space-y-5">
                <!-- Cabang Kost -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Pilih Cabang Kost</label>
                    <select id="inputCabang" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-900 bg-white">
                        <option value="" disabled selected>-- Pilih Cabang --</option>
                        <option value="Madani 1">Madani 1</option>
                        <option value="Madani 2">Madani 2</option>
                        <option value="Madani Putri">Madani Putri</option>
                    </select>
                </div>

                <!-- Nama Penghuni -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Nama Penghuni</label>
                    <input type="text" id="inputNama" placeholder="Masukkan nama lengkap" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-900">
                </div>

                <!-- Nomor Kamar -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Nomor / Nama Kamar</label>
                    <input type="text" id="inputKamar" placeholder="Contoh: 01 atau Kamar 09" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-900">
                </div>

                <!-- Periode Bulan & Tahun -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Bulan Pembayaran</label>
                        <select id="inputBulan" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-900 bg-white">
                            <option value="Januari">Januari</option>
                            <option value="Februari">Februari</option>
                            <option value="Maret">Maret</option>
                            <option value="April">April</option>
                            <option value="Mei">Mei</option>
                            <option value="Juni">Juni</option>
                            <option value="Juli">Juli</option>
                            <option value="Agustus">Agustus</option>
                            <option value="September">September</option>
                            <option value="Oktober">Oktober</option>
                            <option value="November">November</option>
                            <option value="Desember">Desember</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Tahun</label>
                        <input type="number" id="inputTahun" value="2026" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-900">
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-500/30 transition active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> Kirim Konfirmasi Pembayaran
                </button>
            </form>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-slate-500 text-sm">
            <p>© 2026 Kost Madani. Sistem Informasi Pembayaran Kost.</p>
        </div>
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        function simpanPembayaran(e) {
            e.preventDefault();

            const cabang = document.getElementById('inputCabang').value;
            const nama = document.getElementById('inputNama').value;
            const kamar = document.getElementById('inputKamar').value;
            const bulan = document.getElementById('inputBulan').value;
            const tahun = document.getElementById('inputTahun').value;

            // Format tanggal saat ini (DD/MM/YYYY)
            const today = new Date();
            const tanggalStr = `${today.getDate()}/${today.getMonth() + 1}/${today.getFullYear()}`;

            // Objek data transaksi
            const dataBaru = {
                id: 'trx_' + Date.now(),
                tanggal: tanggalStr,
                cabang: cabang,
                nama: nama,
                kamar: kamar,
                bulan: bulan,
                tahun: tahun,
                status: 'Menunggu Konfirmasi'
            };

            // Ambil data dari localStorage
            let transaksiList = JSON.parse(localStorage.getItem('transaksi_kost')) || [];

            // Tambahkan data baru
            transaksiList.unshift(dataBaru);

            // Simpan ke localStorage (diperbaiki tanpa sintaks ganda)
            localStorage.setItem('transaksi_kost', JSON.stringify(transaksiList));

            // Notifikasi & reset
            document.getElementById('alertSuccess').classList.remove('hidden');
            document.getElementById('formPembayaran').reset();

            setTimeout(() => {
                document.getElementById('alertSuccess').classList.add('hidden');
            }, 4000);
        }
    </script>
</body>
</html>
